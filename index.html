<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lyckohjul</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game">

    <h1>LYCKOHJUL</h1>

    <p class="subtitle">
        Выберите свой счастливый номер
    </p>


    <section class="wheel-area">

        <!-- Тонкая острая стрелка -->
        <div class="pointer">
            <div class="pointer-head"></div>
        </div>


        <div class="wheel-frame">

            <div
                class="wheel"
                id="wheel"
            ></div>


            <div class="wheel-center">
                <span>★</span>
            </div>

        </div>

    </section>


    <section class="number-selection">

        <p>ВАШ НОМЕР</p>

        <div
            class="numbers"
            id="numbers"
        ></div>

    </section>


    <button
        class="spin-button"
        id="spinButton"
        disabled
    >
        КРУТИТЬ!
    </button>


    <div
        class="result hidden"
        id="result"
    >

        <div class="result-title">
            🎉 ПОЗДРАВЛЯЕМ!
        </div>

        <div
            class="result-number"
            id="resultNumber"
        ></div>

        <div
            class="result-prize"
            id="resultPrize"
        ></div>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
